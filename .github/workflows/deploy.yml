name: Publicar 7Dylz en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - '7Dylz_Web_FINAL_LISTA_PARA_PUBLICAR.zip'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar portafolio
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Extraer y verificar la pagina
        shell: bash
        run: |
          set -euo pipefail
          test -f 7Dylz_Web_FINAL_LISTA_PARA_PUBLICAR.zip
          mkdir -p _build _site
          unzip -q 7Dylz_Web_FINAL_LISTA_PARA_PUBLICAR.zip -d _build
          cp -a _build/7Dylz_Web_FINAL_PUBLICABLE/. _site/
          test -s _site/index.html
          test -s _site/style.css
          test -s _site/script.js
          test -s _site/assets/killua-hero.webp
          for i in 1 2 3 4; do
            test -s "_site/assets/project-${i}.webp"
          done

      - name: Copiar web a main para Pages desde rama
        shell: bash
        run: |
          set -euo pipefail
          cp -a _site/. .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css script.js assets .nojekyll README_PUBLICACION.txt
          if ! git diff --cached --quiet; then
            git commit -m "Publish 7Dylz static website"
            git push origin HEAD:main
          fi

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir pagina
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Publicar con GitHub Actions
        id: deployment
        uses: actions/deploy-pages@v4
